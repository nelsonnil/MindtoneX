name: MagicCall
options:
  bundleIdPrefix: com.nelson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release
  TestFlight: release
  AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Pon aquí tu Team ID o elígelo en Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: "6XSHKM2M34"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "79"

targets:
  MagicCall:
    type: application
    platform: iOS
    sources:
      - path: MagicCall/Sources
      - path: MagicCall/Resources
    settings:
      base:
        # Cámbialo por uno único tuyo (p. ej. com.tunombre.tonos).
        PRODUCT_BUNDLE_IDENTIFIER: com.nelson.magiccall
        PRODUCT_NAME: MagicCall
        INFOPLIST_FILE: MagicCall/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MindtoneX
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: MagicCall/Sources/Support/MagicCall-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG MAGIC_PRIVATE_PROBES"
        # App Store / TestFlight externo / Archive producción: SIN APIs privadas (evita ITMS-90338).
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        # Solo probadores internos: experimentos privados (dlopen, tonos, etc.).
        TestFlight:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MAGIC_PRIVATE_PROBES"

schemes:
  MagicCall:
    build:
      targets:
        MagicCall: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: AppStore
  MagicCall-AppStore:
    build:
      targets:
        MagicCall: all
    run:
      config: Release
    archive:
      config: AppStore
  MagicCall-TestFlight:
    build:
      targets:
        MagicCall: all
    run:
      config: TestFlight
    archive:
      config: TestFlight
