name: MagicCall
options:
  bundleIdPrefix: com.nelson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  locales:
    - en
    - es

configs:
  Debug: debug
  Release: release
  TestFlight: release
  AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "6XSHKM2M34"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "105"

targets:
  MagicCall:
    type: application
    platform: iOS
    sources:
      - path: MagicCall/Sources
      - path: MagicCall/Resources
        excludes:
          - "InterferenceRingtone"
          - "InterferenceRingtone/**"
      # Folder reference: swap ringtone/interference .m4a files with the same names, no project edits.
      - path: MagicCall/Resources/InterferenceRingtone
        type: folder
    entitlements:
      path: MagicCall/MagicCall.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nelson.tono
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelson.tono
        PRODUCT_NAME: MagicCall
        INFOPLIST_FILE: MagicCall/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MindtoneX
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: MagicCall/Sources/Support/MagicCall-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG MAGIC_PRIVATE_PROBES"
          ENABLE_TESTABILITY: YES
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        TestFlight:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MAGIC_PRIVATE_PROBES"
    dependencies:
      - target: MagicCallCallDirectory
        embed: true

  MagicCallCallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: MagicCallCallDirectory
    entitlements:
      path: MagicCallCallDirectory/MagicCallCallDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nelson.tono
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelson.tono.CallDirectory
        INFOPLIST_FILE: MagicCallCallDirectory/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES

  MagicCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MagicCallTests
    dependencies:
      - target: MagicCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nelson.tono.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MagicCall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MagicCall"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MagicCall:
    build:
      targets:
        MagicCall: all
        MagicCallCallDirectory: all
        MagicCallTests: [test]
    test:
      targets:
        - MagicCallTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: AppStore
  MagicCall-AppStore:
    build:
      targets:
        MagicCall: all
        MagicCallCallDirectory: all
    run:
      config: Release
    archive:
      config: AppStore
  MagicCall-TestFlight:
    build:
      targets:
        MagicCall: all
        MagicCallCallDirectory: all
    run:
      config: TestFlight
    archive:
      config: TestFlight
